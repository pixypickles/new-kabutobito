<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>カブトビト大冒険 - コースクリア</title><style>html,body{margin:0;width:100%;height:100%;background:#142033;color:#fff;font-family:monospace;overflow:hidden}body{display:grid;place-items:center}.card{width:min(760px,90vw);text-align:center;padding:46px 28px;border:4px solid #d9f4ff;border-radius:24px;background:#20344d;box-shadow:0 10px 0 #0a1320}.small{font-size:22px;opacity:.85}.stage{font:bold clamp(48px,10vw,86px) sans-serif;margin:10px 0 26px}.stats{display:flex;justify-content:center;gap:42px;flex-wrap:wrap;font:bold 25px sans-serif}.leaf{color:#8ed8ff}.hint{margin-top:24px;font-size:18px;opacity:.8}button{margin-top:26px;border:3px solid #fff;border-radius:14px;background:#315b82;color:#fff;padding:13px 34px;font:bold 21px sans-serif;cursor:pointer}</style></head><body><div class="card"><div class="small">COURSE CLEAR!</div><div class="stage" id="stage"></div><div class="stats"><span>ミス回数　<span id="miss"></span></span><span class="leaf">🍃 × <span id="leaf"></span></span><span>SCORE　<span id="score"></span></span></div><button id="go">つぎへ</button> <button id="title" style="display:none">タイトルへ戻る</button><div class="hint">A / B / Enter でも進めます</div></div><script>const next=localStorage.getItem('kabutobitoNextStage')||'index.html';const clearedStage=localStorage.getItem('kabutobitoClearedStage')||'';
const nextMatch=next.match(/world(\d-\d)\.html/);
const nextLabel=nextMatch?nextMatch[1]:'';
document.getElementById('stage').textContent=nextLabel?'NEXT '+nextLabel:'CLEAR';document.getElementById('miss').textContent=localStorage.getItem('maruchibiMisses')||'0';document.getElementById('leaf').textContent=localStorage.getItem('maruchibiStars')||'0';document.getElementById('score').textContent=String(Number(localStorage.getItem('maruchibiScore')||0)).padStart(6,'0');let ready=false;setTimeout(()=>ready=true,650);function go(){if(ready)location.href=next}document.getElementById('go').onclick=go;const cleared=localStorage.getItem('kabutobitoClearedStage')||'';const titleBtn=document.getElementById('title');if(cleared==='3-4')titleBtn.style.display='inline-block';titleBtn.onclick=()=>location.href='index.html';addEventListener('keydown',e=>{if(['Enter',' ','z','Z','a','A','b','B'].includes(e.key))go()});</script></body></html>
