<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>カブトビト大冒険</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#222;touch-action:none;font-family:monospace}
#wrap{width:100%;height:100%;display:grid;place-items:center}
canvas{width:100vw;height:auto;max-height:100vh;aspect-ratio:16/9;image-rendering:pixelated;background:#76d2ef}
.touch{display:none;position:fixed;z-index:9999;touch-action:none}
#stickBase{width:132px;height:132px;border:3px solid #fff;border-radius:50%;background:#0005;position:relative}
#stickKnob{width:60px;height:60px;border:3px solid #fff;border-radius:50%;background:#ffffff44;position:absolute;left:33px;top:33px}
.dir{position:absolute;color:#fff;font-size:23px;pointer-events:none}
#dl{left:8px;top:50px}#dr{right:8px;top:50px}#du{left:54px;top:2px}#dd{left:54px;bottom:2px}
.actions{gap:18px;align-items:center}
.actions button{-webkit-appearance:none;appearance:none;width:92px;height:92px;padding:0;border:4px solid #fff;border-radius:50%;background:#0009;color:#fff;font:bold 36px monospace;touch-action:none}
#hint{position:fixed;bottom:5px;left:0;right:0;text-align:center;color:#fff;text-shadow:2px 2px #000;font-size:13px}
@media(pointer:coarse),(max-width:1100px){
 .touch{display:flex!important}
 .left{left:18px;bottom:24px}.right{right:24px;bottom:38px}
 #hint{display:none}
}

<body><script>localStorage.setItem('maruchibiCurrentStage','world1-3.html');</script>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="hint">← → 移動　A/Z/Space ジャンプ・空中で滑空　B 角すくい投げ　↓ しゃがむ</div>
<div class="touch left"><div id="stickBase">
<span class="dir" id="dl">←</span><span class="dir" id="dr">→</span><span class="dir" id="du">↑</span><span class="dir" id="dd">↓</span>
<div id="stickKnob"></div></div></div>
<div class="touch right actions"><button id="B">B</button><button id="J">A</button></div>
<script>
const c=document.getElementById('c'),g=c.getContext('2d');g.imageSmoothingEnabled=false;
const LOOP2=localStorage.getItem('maruchibiLoop2')==='1';
const W=960,H=540,GROUND=480,WORLD=1200;
let keys={},cam=0,camY=0,score=0,stars=0,dead=false,won=false,jumpHeld=false,notice='',noticeT=0,frame=0,hornHit=null,hornGuard=null,stageExit=0;
const p={x:90,y:GROUND-44,w:38,h:44,vx:0,vy:0,on:false,big:false,glove:false,face:1,crouch:false,inv:0,anim:0,punchT:0,punchCd:0,hornT:0,hornCd:0,hornDashT:0,hornDashCd:0,dashStrikeT:0,wallGrab:false,wallDir:0,wallLock:0,blueHorn:LOOP2,element:localStorage.getItem('kabutoElement')||''};
if(LOOP2){p.blueHorn=true;p.big=true;p.glove=false;if(p.h<62){let _f=p.y+p.h;p.h=62;p.y=_f-62;}}
if(localStorage.getItem('maruchibiBig')==='1'){p.big=true;setTimeout(()=>{if(p.h<62){let feet=p.y+p.h;p.h=62;p.y=feet-62;}},0)}
if(localStorage.getItem('maruchibiBlueHorn')==='1')p.blueHorn=true;


const grounds=[{x:0,y:480,w:1200,h:80},
 // The solid outer trunks have actual collision and can be wall-grabbed.
 {x:0,y:-3500,w:68,h:3980},{x:1132,y:-3500,w:68,h:3980}];
const ledges=[
{x:165,y:375,w:225,h:28},
{x:360,y:270,w:225,h:28},
{x:565,y:165,w:225,h:28},
{x:735,y:60,w:225,h:28},
{x:550,y:-45,w:225,h:28},
{x:350,y:-150,w:225,h:28},
{x:165,y:-255,w:225,h:28},
{x:360,y:-360,w:225,h:28},
{x:565,y:-465,w:225,h:28},
{x:735,y:-570,w:225,h:28},
{x:550,y:-675,w:225,h:28},
{x:350,y:-780,w:225,h:28},
{x:165,y:-885,w:225,h:28},
{x:360,y:-990,w:225,h:28},
{x:565,y:-1095,w:225,h:28},
{x:735,y:-1200,w:225,h:28},
{x:550,y:-1305,w:225,h:28},
{x:350,y:-1410,w:225,h:28},
{x:165,y:-1515,w:225,h:28},
{x:360,y:-1620,w:225,h:28},
{x:565,y:-1725,w:225,h:28},
{x:735,y:-1830,w:225,h:28},
{x:550,y:-1935,w:225,h:28},
{x:350,y:-2040,w:225,h:28},
{x:575,y:-2040,w:250,h:28},{x:825,y:-2040,w:270,h:28},
{x:740,y:-2150,w:205,h:28},{x:505,y:-2255,w:215,h:28},
{x:270,y:-2360,w:215,h:28},{x:145,y:-2465,w:215,h:28},
{x:390,y:-2570,w:215,h:28},{x:635,y:-2675,w:215,h:28},
{x:830,y:-2780,w:215,h:28},{x:595,y:-2885,w:215,h:28},
{x:370,y:-2990,w:215,h:28},{x:605,y:-3095,w:215,h:28},
{x:835,y:-3200,w:260,h:28}
];

// Solid outward-reaching branches interrupt the two wall-climb shortcuts.
// The center divider creates a genuine left/right choice at mid-height.
const trunkObstacles=[
 {x:68,y:-260,w:260,h:48},{x:880,y:-580,w:252,h:48},
 {x:68,y:-920,w:290,h:48},{x:858,y:-1320,w:274,h:48},
 {x:68,y:-1740,w:275,h:48},{x:870,y:-1980,w:262,h:48},
 {x:560,y:-1415,w:60,h:510},
 {x:68,y:-2365,w:240,h:44},{x:890,y:-2650,w:242,h:44},
 {x:68,y:-2940,w:270,h:44}
];
let blocks=[];
// No pipe/stump enemies in the forest. Stag-beetle folk are aerial hunters.
let pipes=[];
let flyingStags=[
{x:480,y:-480,baseY:-480,vx:2.5,minX:370,maxX:730,phase:0,alive:1,w:48,h:34},
{x:450,y:-1260,baseY:-1260,vx:-2.7,minX:300,maxX:720,phase:0,alive:1,w:48,h:34},
{x:500,y:-1850,baseY:-1850,vx:2.9,minX:360,maxX:780,phase:0,alive:1,w:48,h:34}
,{x:460,y:-2450,baseY:-2450,vx:1.2,minX:340,maxX:630,phase:1,alive:1,w:48,h:34,kind:2},
{x:770,y:-2900,baseY:-2900,vx:-1.3,minX:620,maxX:920,phase:3,alive:1,w:48,h:34,kind:0},
{x:755,y:-1040,baseY:-1040,vx:1.25,minX:700,maxX:835,phase:0,alive:1,w:48,h:34,kind:1},{x:830,y:-1190,baseY:-1190,vx:-1.1,minX:740,maxX:910,phase:2,alive:1,w:48,h:34,kind:3},{x:755,y:-1340,baseY:-1340,vx:1.3,minX:690,maxX:870,phase:4,alive:1,w:48,h:34,kind:4}];
// A separate walking stag-beetle type patrols the upper branches.
let walkingStags=[];
// Forest insect folk: ladybug walkers and snail folk.
let ants=[
{x:430,y:-128,v:-.6,alive:1,flat:0},
{x:610,y:-653,v:.7,alive:1,flat:0},
{x:390,y:-1283,v:-.7,alive:1,flat:0}
];
let snails=[];
let pickups=[],particles=[],thrownStags=[];let springPollen=[];
// A large green selector berry: horn strikes cycle red -> blue -> yellow.
let elementalBerries=[{x:360,y:265,w:43,h:43,choice:-1,got:false,hitLock:0}];
let pollenStun=0;
// Hanging vines: hold UP near a vine to grab, UP/DOWN to climb, jump to release.
const hangingVines=[{x:355,top:-470,bottom:-140},{x:770,top:-1080,bottom:-750},{x:355,top:-1710,bottom:-1380},{x:775,top:-2340,bottom:-2010},{x:435,top:-2960,bottom:-2650}];
let grabbedVine=null, vineJumpLock=0;

// Discolored bark can be opened with the horn. Sap stays on the tree instead of appearing in a bottle.
let sapSpots=[{x:560,y:-1190,w:40,h:50,hit:0,sap:0}];
// Small blue berries grow directly from branches. One berry is worth five blue leaves.
let blueBerries=[{x:420,y:-520},{x:610,y:-1150},{x:400,y:-1780}].map(q=>({...q,w:24,h:24,got:0}));
let airLeaves=ledges.filter((q,i)=>i%2===0).map(q=>({x:q.x+q.w/2,y:q.y-42,w:24,h:24,got:0}));

/* LOOP2 ENHANCER */
if(LOOP2){
  
  const tougher=(arr,dx)=>{if(!Array.isArray(arr)||!arr.length)return;let add=[];for(let i=0;i<arr.length;i+=2){let e=arr[i];if(!e||typeof e.x!=='number')continue;let n={...e,x:e.x+dx,alive:1};if('cd' in n)n.cd=Math.max(22,(n.cd||60)-12);if('safeT' in n)n.safeT=0;add.push(n)}arr.push(...add)};
  if(typeof grasshoppers!=='undefined')tougher(grasshoppers,150);
  if(typeof snails!=='undefined')tougher(snails,210);
  if(typeof ants!=='undefined')tougher(ants,175);
  if(typeof frogs!=='undefined')tougher(frogs,190);
  if(typeof throwers!=='undefined')tougher(throwers,230);
  if(typeof waterShooters!=='undefined')tougher(waterShooters,185);
}
let loopBullets=[],loopBursts=[],loopBulletClock=0;
function R(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function groundAt(x,y){
 return grounds.some(q=>x>=q.x&&x<=q.x+q.w&&y>=q.y-3&&y<=q.y+q.h);
}
function solids(){
 return grounds.concat(ledges).concat(trunkObstacles).concat(pipes.filter(q=>q.alive)).concat(blocks.filter(b=>!b.broken).map(b=>({x:b.x,y:b.y,w:48,h:48,block:b})));
}
function debris(x,y,n=7){
 for(let i=0;i<n;i++)particles.push({x:x+24,y:y+20,vx:(Math.random()*6-3),vy:-3-Math.random()*5,t:55,r:3+Math.random()*5});
}
function release(b){
 if(!b||b.released)return;b.released=1;b.hit=1;
 // Block leaves are collected instantly when the block is hit; the popped leaf is visual only.
 if(b.type==='leaf'){
   stars++;score+=400;notice='青葉っぱ +1';noticeT=55;
   pickups.push({x:b.x+10,y:b.y-34,w:30,h:30,type:'leafFx',vy:-3,t:0,got:0});
 }else{
   pickups.push({x:b.x+10,y:b.y-34,w:30,h:30,type:b.type,vy:-3,t:0});score+=100;
 }
}
function setH(h){let f=p.y+p.h;p.h=h;p.y=f-h}
function canStand(){if(!p.big)return true;let q={x:p.x,y:p.y-(62-p.h),w:p.w,h:62};return !solids().some(s=>!ledges.includes(s)&&R(q,s))}
function hurt(force=false){if(p.hornT>0&&!force)return;
 if(p.inv)return;
 if(p.glove){p.inv=100;p.vy=-5}
 else if(p.big){p.big=false;p.crouch=false;setH(44);p.inv=100;p.vy=-5}
 else{dead=true;p.element='';localStorage.removeItem('kabutoElement');p.vy=-9;localStorage.setItem('maruchibiMisses',String(Number(localStorage.getItem('maruchibiMisses')||0)+1))}
}
function breakBlock(b){if(!b||b.broken)return;release(b);b.broken=1;debris(b.x,b.y,9);score+=100}
function breakPipe(q){if(!q.alive)return;q.alive=0;debris(q.x,q.y,15);score+=500}
function shellHitBox(s){return{x:s.x-3,y:s.y+10,w:42,h:28}}
function kickShell(s,dir){s.shell=1;s.shellV=dir*11;s.v=0;score+=100}
function stompableTop(e,h){return p.vy>1 && p.y+p.h-12<=e.y+h*.8}
function scoopProtected(r){
 // During the complete horn-scoop animation, normal enemy contact cannot hurt the player.
 // This avoids a second collision pass damaging the player after the scoop has begun.
 return p.hornT>0;
}


// Shared item art: broad blue leaf with visible veins, and bottled tree sap.
function drawBlueLeaf(cx,cy,scale=1){
 g.save();g.translate(cx,cy);g.scale(scale,scale);g.rotate(-.45);
 g.fillStyle='#55aee8';g.strokeStyle='#244f78';g.lineWidth=2;
 g.beginPath();g.moveTo(0,-15);g.bezierCurveTo(12,-11,14,2,0,15);g.bezierCurveTo(-14,2,-12,-11,0,-15);g.fill();g.stroke();
 g.strokeStyle='#d8f4ff';g.lineWidth=1.6;g.beginPath();g.moveTo(0,-12);g.lineTo(0,14);
 for(let yy=-7;yy<=7;yy+=7){g.moveTo(0,yy);g.lineTo(7,yy-5);g.moveTo(0,yy);g.lineTo(-7,yy-5)}g.stroke();
 g.strokeStyle='#244f78';g.lineWidth=2;g.beginPath();g.moveTo(0,14);g.lineTo(6,20);g.stroke();g.restore();
}
function drawSapBottle(cx,cy,scale=1){
 g.save();g.translate(cx,cy);g.scale(scale,scale);
 g.fillStyle='#f4fbff99';g.strokeStyle='#d9f4ff';g.lineWidth=2;g.beginPath();
 g.moveTo(-6,-15);g.lineTo(6,-15);g.lineTo(7,-9);g.quadraticCurveTo(13,-5,13,5);g.lineTo(13,13);g.quadraticCurveTo(0,18,-13,13);g.lineTo(-13,5);g.quadraticCurveTo(-13,-5,-7,-9);g.closePath();g.fill();g.stroke();
 g.fillStyle='#d98b28';g.beginPath();g.moveTo(-11,2);g.lineTo(11,2);g.lineTo(11,12);g.quadraticCurveTo(0,16,-11,12);g.closePath();g.fill();
 g.fillStyle='#79502d';g.fillRect(-7,-19,14,5);g.fillStyle='#fff6d6';g.strokeStyle='#8b6536';g.lineWidth=1;g.fillRect(-10,3,20,8);
 g.fillStyle='#68451f';g.font='bold 6px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('樹液',0,7);g.restore();
}

function reset(){location.reload()}
function nextStage(url){
 localStorage.setItem('maruchibiScore',String(score));localStorage.setItem('maruchibiStars',String(stars));
 localStorage.setItem('maruchibiBig',p.big?'1':'0');localStorage.setItem('maruchibiGlove','0');localStorage.setItem('maruchibiBlueHorn',p.blueHorn?'1':'0');
 localStorage.setItem('kabutobitoClearedStage','1-3');localStorage.setItem('kabutobitoNextStage',url);
 location.href='stage-clear.html';
}
onkeydown=e=>{let k=e.key.toLowerCase();keys[k]=1;if(k==='b')keys.punch=1;if(k==='r')reset()};
onkeyup=e=>{let k=e.key.toLowerCase();keys[k]=0;if(k==='b')keys.punch=0};
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());
window.addEventListener('blur',()=>keys={});

function bindHold(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[k]=1};let up=e=>{e.preventDefault();keys[k]=0};b.onpointerup=up;b.onpointercancel=up;b.onlostpointercapture=()=>keys[k]=0}
bindHold('J','z');bindHold('B','punch');
const sb=document.getElementById('stickBase'),sk=document.getElementById('stickKnob');let sid=null;
function sm(e){let r=sb.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=43;if(d>m){dx*=m/d;dy*=m/d}sk.style.transform=`translate(${dx}px,${dy}px)`;keys.arrowleft=dx<-18;keys.arrowright=dx>18;keys.arrowdown=dy>25;keys.arrowup=dy<-30}
sb.onpointerdown=e=>{e.preventDefault();sid=e.pointerId;sb.setPointerCapture?.(sid);sm(e)};sb.onpointermove=e=>{if(e.pointerId===sid)sm(e)};
function su(e){if(sid===null||e.pointerId===sid){sid=null;sk.style.transform='translate(0,0)';keys.arrowleft=keys.arrowright=keys.arrowdown=keys.arrowup=0}}sb.onpointerup=su;sb.onpointercancel=su;sb.onlostpointercapture=su;

function moveActor(a,w,h){
 let oldY=a.y;a.vy=(a.vy||0)+.55;a.y+=a.vy;
 let floor=null;
 for(let s of grounds.concat(ledges).concat(pipes.filter(q=>q.alive))){
   if(a.x+w>s.x&&a.x<s.x+s.w&&oldY+h<=s.y+6&&a.y+h>=s.y){floor=s;break}
 }
 if(floor){a.y=floor.y-h;a.vy=0;a.on=true}else a.on=false;
}

/*LOOP2_LADY_TO_THROWER*/
if(LOOP2&&typeof ladybugs!=='undefined'&&Array.isArray(ladybugs)&&typeof throwers!=='undefined'){
 for(let e of ladybugs)if(e&&e.alive!==0)throwers.push({x:e.x,y:e.y,w:38,h:50,alive:1,face:-1,t:Math.floor(Math.random()*70)});
 ladybugs.length=0;
}
let hornTapDir=0,hornTapFrame=-999,hornReadyDir=0,hornReadyT=0,prevHornL=false,prevHornR=false,hornBHeld=false;

// Spring beehives: harmless until touched; then release three pursuing workers.
let springHives=[{'x': 920, 'y': -1320, 'active': false, 'pulse': 0, 'fallen': false, 'triggerT': 0}, {'x': 310, 'y': -2060, 'active': false, 'pulse': 0, 'fallen': false, 'triggerT': 0}, {'x': 930, 'y': -2810, 'active': false, 'pulse': 0, 'fallen': false, 'triggerT': 0}];
let springBees=[];
function spawnSpringBees(x,y,count=3){
 for(let i=0;i<count;i++)springBees.push({x:x+(i-1)*19,y:y-18-i*14,vx:0,vy:0,t:380,phase:i*2.1,delay:i*22});
}
function updateSpringBees(){
 const beeHit=typeof hornHit!=='undefined'&&hornHit;
 for(const b of springBees){
   if(b.delay>0)continue;
   if(beeHit&&R(beeHit,{x:b.x-13,y:b.y-13,w:26,h:26})){b.t=0;score+=150;debris(b.x,b.y,5);}
 }
 if(typeof freeBees!=='undefined')for(const b of freeBees){
   if(!b.alive)continue;
   b.phase+=.035;b.x+=Math.sin(b.phase)*.55;b.y=b.baseY+Math.sin(b.phase*2)*17;
   if(beeHit&&R(beeHit,{x:b.x-13,y:b.y-13,w:26,h:26})){b.alive=false;score+=150;debris(b.x,b.y,5);}
 }

 for(const h of springHives){
   if(h.pulse>0)h.pulse--;
   if(h.fallen){h.y+=12;continue;}
   if(!h.active&&!(p.hornDashT>0||p.dashStrikeT>0)&&R(p,{x:h.x-25,y:h.y-30,w:50,h:58})){
     h.active=true;h.pulse=60;h.triggerT=48;
     notice='ハチの巣が揺れている！';noticeT=75;
   }
   if(h.triggerT>0){h.triggerT--;if(h.triggerT===0)spawnSpringBees(h.x,h.y,3);}

 }
 for(const b of springBees){
   if(b.t<=0)continue;
   if(b.delay>0){b.delay--;continue;}
   b.phase+=.22;
   let tx=p.x+p.w/2,ty=p.y+p.h/2;
   b.vx=Math.max(-2.9,Math.min(2.9,b.vx+(tx-b.x)*.003));
   b.vy=Math.max(-2.4,Math.min(2.4,b.vy+(ty-b.y)*.003));
   if(b.fromBelow&&b.y>p.y+160){b.y-=4.8;}else{b.fromBelow=false;b.x+=b.vx;b.y+=b.vy+Math.sin(b.phase)*.65;}b.t--;
   if(R(p,{x:b.x-12,y:b.y-12,w:24,h:24})&&p.inv===0)hurt();
 }
 springBees=springBees.filter(b=>b.t>0);
}

function drawWorkerBee(b){
 g.save();g.translate(b.x,b.y);
 const facing=(b.vx||0)<0?-1:1;g.scale(facing,1);
 g.fillStyle='#e9f9ffcc';g.strokeStyle='#9dbcc9';g.lineWidth=1.5;
 g.beginPath();g.ellipse(-10,-10,9,6,-.4,0,Math.PI*2);g.ellipse(10,-10,9,6,.4,0,Math.PI*2);g.fill();g.stroke();
 // Human-like head, striped upright torso, arms and legs.
 g.fillStyle='#ffe5a3';g.strokeStyle='#674628';g.lineWidth=2;
 g.beginPath();g.arc(0,-15,8,0,Math.PI*2);g.fill();g.stroke();
 g.fillStyle='#f7cb46';g.beginPath();g.ellipse(0,3,9,13,0,0,Math.PI*2);g.fill();g.stroke();
 g.strokeStyle='#563a24';g.lineWidth=3;g.beginPath();g.moveTo(-8,-2);g.lineTo(8,-2);g.moveTo(-8,6);g.lineTo(8,6);g.stroke();
 g.strokeStyle='#694523';g.lineWidth=2.8;g.beginPath();
 g.moveTo(-7,0);g.lineTo(-15,9);g.moveTo(7,0);g.lineTo(16,-6);
 g.moveTo(-4,14);g.lineTo(-7,22);g.moveTo(4,14);g.lineTo(8,22);g.stroke();
 // Spear held by the right arm.
 g.strokeStyle='#80684d';g.lineWidth=2;g.beginPath();g.moveTo(16,10);g.lineTo(16,-25);g.stroke();
 g.fillStyle='#aabdc3';g.beginPath();g.moveTo(16,-31);g.lineTo(11,-22);g.lineTo(21,-22);g.closePath();g.fill();
 g.fillStyle='#322720';g.beginPath();g.arc(-3,-16,1.5,0,7);g.arc(3,-16,1.5,0,7);g.fill();
 g.restore();
}
function drawSpringBees(){
 for(const h of springHives){
   if(h.fallen&&h.y>600)continue;
   g.save();g.translate(h.x,h.y);
   g.fillStyle='#e8ac40';g.strokeStyle='#895322';g.lineWidth=3;
