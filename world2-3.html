 {x:5660,y:372,w:38,h:38,v:.7,vy:0,on:true,alive:1,shell:0,shellV:0},{x:6820,y:372,w:38,h:38,v:-.7,vy:0,on:true,alive:1,shell:0,shellV:0}

 {x:3350,y:362,w:38,h:48,vx:0,vy:0,on:true,cd:30,alive:1},{x:4750,y:362,w:38,h:48,vx:0,vy:0,on:true,cd:55,alive:1},
 {x:5850,y:362,w:38,h:48,vx:0,vy:0,on:true,cd:35,alive:1},{x:6950,y:362,w:38,h:48,vx:0,vy:0,on:true,cd:48,alive:1}

 {x:5100,baseX:5100,t:255,wait:0,alive:1},{x:6350,baseX:6350,t:55,wait:0,alive:1},{x:7050,baseX:7050,t:140,wait:0,alive:1}

 {x:5480,y:362,w:42,h:48,face:-1,cd:70,alive:1},{x:6650,y:362,w:42,h:48,face:-1,cd:105,alive:1}

/* LOOP2 ENHANCER */
if(LOOP2){
  
  const tougher=(arr,dx)=>{if(!Array.isArray(arr)||!arr.length)return;let add=[];for(let i=0;i<arr.length;i+=2){let e=arr[i];if(!e||typeof e.x!=='number')continue;let n={...e,x:e.x+dx,alive:1};if('cd' in n)n.cd=Math.max(22,(n.cd||60)-12);if('safeT' in n)n.safeT=0;add.push(n)}arr.push(...add)};
  if(typeof grasshoppers!=='undefined')tougher(grasshoppers,150);
  if(typeof snails!=='undefined')tougher(snails,210);
  if(typeof ants!=='undefined')tougher(ants,175);
  if(typeof frogs!=='undefined')tougher(frogs,190);

let loopBullets=[],loopBursts=[],loopBulletClock=0;
function R(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function groundAt(x,y){
 return grounds.some(q=>x>=q.x&&x<=q.x+q.w&&y>=q.y-3&&y<=q.y+q.h);
}
function solids(){
 return grounds.concat(ledges).concat(pipes.filter(q=>q.alive)).concat(blocks.filter(b=>!b.broken).map(b=>({x:b.x,y:b.y,w:48,h:48,block:b})));
}
function debris(x,y,n=7){
 for(let i=0;i<n;i++)particles.push({x:x+24,y:y+20,vx:(Math.random()*6-3),vy:-3-Math.random()*5,t:55,r:3+Math.random()*5});
}
function release(b){
 if(!b||b.released)return;b.released=1;b.hit=1;
 // Block leaves are collected instantly when the block is hit; the popped leaf is visual only.
 if(b.type==='leaf'){
   stars++;score+=400;notice='青葉っぱ +1';noticeT=55;
   pickups.push({x:b.x+10,y:b.y-34,w:30,h:30,type:'leafFx',vy:-3,t:0,got:0});
 }else{
   pickups.push({x:b.x+10,y:b.y-34,w:30,h:30,type:b.type,vy:-3,t:0});score+=100;
 }
}
function setH(h){let f=p.y+p.h;p.h=h;p.y=f-h}
function canStand(){if(!p.big)return true;let q={x:p.x,y:p.y-(62-p.h),w:p.w,h:62};return !solids().some(s=>R(q,s))}
function hurt(force=false){if(p.hornT>0&&!force)return;
 if(p.inv)return;
 if(p.glove){p.inv=100;p.vy=-5}
 else if(p.big){p.big=false;p.crouch=false;setH(44);p.inv=100;p.vy=-5}
 else{dead=true;p.vy=-9;localStorage.setItem('maruchibiMisses',String(Number(localStorage.getItem('maruchibiMisses')||0)+1))}
}
function breakBlock(b){if(!b||b.broken)return;release(b);b.broken=1;debris(b.x,b.y,9);score+=100}
function breakPipe(q){if(!q.alive)return;q.alive=0;debris(q.x,q.y,15);score+=500}
function shellHitBox(s){return{x:s.x-3,y:s.y+10,w:42,h:28}}
function kickShell(s,dir){s.shell=1;s.shellV=dir*11;s.v=0;score+=100}
function stompableTop(e,h){return p.vy>1 && p.y+p.h<=e.y+h*.72}
function scoopProtected(r){
 // During the complete horn-scoop animation, normal enemy contact cannot hurt the player.
 // This avoids a second collision pass damaging the player after the scoop has begun.
 return p.hornT>0;
}


// Shared item art: broad blue leaf with visible veins, and bottled tree sap.
function drawBlueLeaf(cx,cy,scale=1){
 g.save();g.translate(cx,cy);g.scale(scale,scale);g.rotate(-.45);
 g.fillStyle='#55aee8';g.strokeStyle='#244f78';g.lineWidth=2;
 g.beginPath();g.moveTo(0,-15);g.bezierCurveTo(12,-11,14,2,0,15);g.bezierCurveTo(-14,2,-12,-11,0,-15);g.fill();g.stroke();
 g.strokeStyle='#d8f4ff';g.lineWidth=1.6;g.beginPath();g.moveTo(0,-12);g.lineTo(0,14);
 for(let yy=-7;yy<=7;yy+=7){g.moveTo(0,yy);g.lineTo(7,yy-5);g.moveTo(0,yy);g.lineTo(-7,yy-5)}g.stroke();
 g.strokeStyle='#244f78';g.lineWidth=2;g.beginPath();g.moveTo(0,14);g.lineTo(6,20);g.stroke();g.restore();
}
function drawSapBottle(cx,cy,scale=1){
 g.save();g.translate(cx,cy);g.scale(scale,scale);
 g.fillStyle='#f4fbff99';g.strokeStyle='#d9f4ff';g.lineWidth=2;g.beginPath();
 g.moveTo(-6,-15);g.lineTo(6,-15);g.lineTo(7,-9);g.quadraticCurveTo(13,-5,13,5);g.lineTo(13,13);g.quadraticCurveTo(0,18,-13,13);g.lineTo(-13,5);g.quadraticCurveTo(-13,-5,-7,-9);g.closePath();g.fill();g.stroke();
 g.fillStyle='#d98b28';g.beginPath();g.moveTo(-11,2);g.lineTo(11,2);g.lineTo(11,12);g.quadraticCurveTo(0,16,-11,12);g.closePath();g.fill();
 g.fillStyle='#79502d';g.fillRect(-7,-19,14,5);g.fillStyle='#fff6d6';g.strokeStyle='#8b6536';g.lineWidth=1;g.fillRect(-10,3,20,8);
 g.fillStyle='#68451f';g.font='bold 6px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('樹液',0,7);g.restore();
}

function reset(){location.reload()}
function nextStage(url){
 localStorage.setItem('maruchibiScore',String(score));localStorage.setItem('maruchibiStars',String(stars));
 localStorage.setItem('maruchibiBig',p.big?'1':'0');localStorage.setItem('maruchibiGlove','0');localStorage.setItem('maruchibiBlueHorn',p.blueHorn?'1':'0');
 localStorage.setItem('kabutobitoClearedStage','2-3');localStorage.setItem('kabutobitoNextStage',url);
 location.href='stage-clear.html';
}
onkeydown=e=>{let k=e.key.toLowerCase();keys[k]=1;if(k==='b')keys.punch=1;if(k==='r')reset()};
onkeyup=e=>{let k=e.key.toLowerCase();keys[k]=0;if(k==='b')keys.punch=0};
document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('selectstart',e=>e.preventDefault());
window.addEventListener('blur',()=>keys={});

function bindHold(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[k]=1};let up=e=>{e.preventDefault();keys[k]=0};b.onpointerup=up;b.onpointercancel=up;b.onlostpointercapture=()=>keys[k]=0}
bindHold('J','z');bindHold('B','punch');
const sb=document.getElementById('stickBase'),sk=document.getElementById('stickKnob');let sid=null;
function sm(e){let r=sb.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy),m=43;if(d>m){dx*=m/d;dy*=m/d}sk.style.transform=`translate(${dx}px,${dy}px)`;keys.arrowleft=dx<-18;keys.arrowright=dx>18;keys.arrowdown=dy>25;keys.arrowup=dy<-30}
sb.onpointerdown=e=>{e.preventDefault();sid=e.pointerId;sb.setPointerCapture?.(sid);sm(e)};sb.onpointermove=e=>{if(e.pointerId===sid)sm(e)};
function su(e){if(sid===null||e.pointerId===sid){sid=null;sk.style.transform='translate(0,0)';keys.arrowleft=keys.arrowright=keys.arrowdown=keys.arrowup=0}}sb.onpointerup=su;sb.onpointercancel=su;sb.onlostpointercapture=su;

function moveActor(a,w,h){
 let oldY=a.y;a.vy=(a.vy||0)+.55;a.y+=a.vy;
 let floor=null;
 for(let s of grounds.concat(ledges).concat(pipes.filter(q=>q.alive))){
   if(a.x+w>s.x&&a.x<s.x+s.w&&oldY+h<=s.y+6&&a.y+h>=s.y){floor=s;break}
 }
 if(floor){a.y=floor.y-h;a.vy=0;a.on=true}else a.on=false;
}

/*LOOP2_LADY_TO_THROWER*/
if(LOOP2&&typeof ladybugs!=='undefined'&&Array.isArray(ladybugs)&&typeof throwers!=='undefined'){
 for(let e of ladybugs)if(e&&e.alive!==0)throwers.push({x:e.x,y:e.y,w:38,h:50,alive:1,face:-1,t:Math.floor(Math.random()*70)});
 ladybugs.length=0;
}
let hornTapDir=0,hornTapFrame=-999,hornReadyDir=0,hornReadyT=0,prevHornL=false,prevHornR=false,hornBHeld=false;
function update(){/*LOOP2_BLUE_PERMANENT*/if(LOOP2&&!p.blueHorn)p.blueHorn=true;/*LOOP2_DIFFICULTY*/if(LOOP2&&!window.__loop2Tuned){window.__loop2Tuned=1;for(let name of ['enemies','grasshoppers','snails','frogs','throwers']){let a=window[name];if(Array.isArray(a))for(let e of a){if(typeof e.vx==='number')e.vx*=1.12;if(typeof e.speed==='number')e.speed*=1.12}}}/*NO_GENERIC_LOOP_BULLETS*/if(typeof loopBullets!=='undefined')loopBullets.length=0;
 frame++;if(won){winTimer++;if(winTimer===55)nextStage('world2-4.html');return;}
 if(p.inv)p.inv--;if(noticeT)noticeT--;if(p.punchT)p.punchT--;if(p.punchCd)p.punchCd--;if(p.hornT)p.hornT--;if(p.hornCd)p.hornCd--;if(p.hornDashT)p.hornDashT--;if(p.hornDashCd)p.hornDashCd--;if(p.wallLock)p.wallLock--;p.anim+=Math.abs(p.vx)*.16;
 if(dead){p.vy+=.6;p.y+=p.vy;if(p.y>650)setTimeout(reset,350);return}

 let L=keys.arrowleft||keys.a,Rt=keys.arrowright||keys.d,D=keys.arrowdown||keys.s,U=keys.arrowup,J=keys.z||keys[' '];
 // Horn Dash command: tap the same direction twice, then press B while the short command window is active.
 let hornEdgeDir=(Rt&&!prevHornR)?1:((L&&!prevHornL)?-1:0);
 if(hornEdgeDir){if(hornTapDir===hornEdgeDir&&frame-hornTapFrame<=20){hornReadyDir=hornEdgeDir;hornReadyT=30;hornTapDir=0;hornTapFrame=-999}else{hornTapDir=hornEdgeDir;hornTapFrame=frame}}
 prevHornL=!!L;prevHornR=!!Rt;if(hornReadyT>0)hornReadyT--;
 p.lookUp=!!U&&p.on&&!D;
 if(p.big&&p.on&&D){if(!p.crouch){setH(44);p.crouch=true}}else if(p.big&&p.crouch&&canStand()){setH(62);p.crouch=false}
 let max=p.crouch?2.2:7.2;if(p.hornDashT>0){p.vx=p.face*13.2}else{if(L){p.vx=Math.max(p.vx-.48,-max);p.face=-1}if(Rt){p.vx=Math.min(p.vx+.48,max);p.face=1}if(!L&&!Rt)p.vx*=.78;}
 // Beetle wall-cling: hold toward a wall; A/Z jumps away from it.
 if(p.wallGrab){let holding=(p.wallDir<0&&L)||(p.wallDir>0&&Rt);if(!holding){p.wallGrab=false}else{p.vx=0;p.vy=0;p.glide=false;if(J&&!jumpHeld){p.wallGrab=false;p.wallLock=10;p.vx=-p.wallDir*8.8;p.vy=-16.2;p.face=-p.wallDir}}}
 if(J&&p.on&&!jumpHeld){if(p.crouch&&canStand()){setH(62);p.crouch=false}p.vy=-17.6;p.on=false}
 // Glide is player-only: after jumping, hold A while descending.
 p.glide=(!p.on&&J&&p.vy>0);
 jumpHeld=!!J;
 if(!p.wallGrab)p.vy=Math.min(p.vy+.58,14);else p.vy=0;
 if(p.glide){if(p.blueHorn)p.vy=0;else if(p.vy>2.15)p.vy=2.15;}
if(keys.punch&&!hornBHeld){
   // Double-tap direction, then B: a distinct command that cannot be stolen by the normal B attack.
   if(D&&!U&&p.hornDashCd<=0){p.attackUp=false;p.punchT=0;p.hornT=18;p.hornCd=Math.max(p.hornCd,27);p.hornDashT=18;p.hornDashCd=38;p.wallGrab=false;p.vx=p.face*13.2;p.vy=Math.min(p.vy,1.2);notice='HORN DASH!';noticeT=24;hornReadyT=0;hornReadyDir=0}
   else if(p.hornCd<=0){p.attackUp=!!U;p.hornT=18;p.hornCd=27;if(p.attackUp&&p.on){p.vy=-2.7;p.on=false}}
 }
 hornBHeld=!!keys.punch;
 if(!p.punchT&&!p.hornT)p.attackUp=false;
 let punch=null;
 if(p.punchT)punch=p.attackUp?{x:p.x-7,y:p.y-58,w:p.w+14,h:66}:{x:p.face>0?p.x+p.w-2:p.x-58,y:p.y+5,w:60,h:Math.max(34,p.h-8)};
 hornHit=null;hornGuard=null;
 let hornActive=p.hornT<=12&&p.hornT>=6;
 if(p.hornT)hornGuard=p.attackUp?{x:p.x-11,y:p.y-(p.blueHorn?92:65),w:p.w+22,h:p.blueHorn?105:78}:{x:p.face>0?p.x+p.w-12:p.x-(p.blueHorn?94:70),y:p.y-10,w:p.blueHorn?98:72,h:p.h+34};
 if(hornActive)hornHit=p.attackUp?{x:p.x-10,y:p.y-(p.blueHorn?88:62),w:p.w+20,h:p.blueHorn?92:64}:{x:p.face>0?p.x+p.w-9:p.x-(p.blueHorn?90:64),y:p.y+1,w:p.blueHorn?92:66,h:p.h+34};
 if(p.hornDashT){hornGuard={x:p.face>0?p.x+p.w-10:p.x-88,y:p.y-8,w:98,h:p.h+24};hornHit={x:p.face>0?p.x+p.w-6:p.x-82,y:p.y,w:88,h:p.h+16};}

 p.x+=p.vx;
 for(let s of solids())if(R(p,s)){let hitDir=p.vx>0?1:(p.vx<0?-1:0);if(p.vx>0)p.x=s.x-p.w;else if(p.vx<0)p.x=s.x+s.w;if(hitDir&&p.hornDashT)p.hornDashT=0;if(hitDir&&!p.on&&!p.wallLock&&((hitDir>0&&Rt)||(hitDir<0&&L))){p.wallGrab=true;p.wallDir=hitDir;p.vy=0;p.glide=false}p.vx=0}
 let oy=p.y;p.y+=p.vy;p.on=false;
 for(let s of solids())if(R(p,s)){
   if(p.vy>0&&oy+p.h<=s.y+8){p.y=s.y-p.h;p.vy=0;p.on=true;p.glide=false;p.wallGrab=false}
   else if(p.vy<0&&oy>=s.y+s.h-8){p.y=s.y+s.h;p.vy=1;if(s.block&&!s.block.hit)release(s.block)}
 }

 if(punch){
   for(let b of blocks)if(!b.broken&&R(punch,{x:b.x,y:b.y,w:48,h:48}))breakBlock(b);
   for(let q of pipes)if(q.alive&&q.rise>.12&&q.bug&&R(punch,q.bug)){q.bugDead=1;q.stagGone=1;q.respawnT=0;q.rise=0;score+=300;debris(q.bug.x,q.bug.y,7)}
   for(let a of ants)if(a.alive&&!a.flat&&R(punch,{x:a.x,y:a.y,w:36,h:30})){a.alive=0;debris(a.x,a.y,6);score+=250}
   for(let s of snails)if(s.alive&&R(punch,{x:s.x,y:s.y,w:38,h:38})){if(s.shell)kickShell(s,p.face);else{s.shell=1;s.shellV=p.face*10;score+=250}}
 }
 // Horn scoop: lift enemies from the front and fling them behind the player.
 /* LOOP2 ALL-ENEMY BULLETS */
 if(LOOP2){

     let baseX=headX+headR*.68,baseY=headY-headR*.40,tipX=baseX+hrLen,tipY=headY-5;
     g.fillStyle=p.blueHorn?'#a8f4ff':'#86c8d8';g.strokeStyle=p.blueHorn?'#eaffff':'#53606d';g.lineWidth=3;
     if(p.blueHorn){g.shadowColor='#8fefff';g.shadowBlur=14}

     let hornBaseTopY=baseY-2,hornBaseBotY=baseY+4;

     g.bezierCurveTo(baseX+hrLen*.82,baseY-1,baseX+hrLen*.42,baseY-2,baseX-1,hornBaseTopY);
