<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>カブトビト大冒険</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07152d;color:#fff;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}body{display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 20%,#214a78 0,#0b2345 35%,#061226 75%)}.wrap{width:min(900px,96vw);border:4px solid #d8f6ff;border-radius:24px;padding:28px;background:#0b2446e8;box-shadow:0 0 35px #69d8ff55}.title{text-align:center;font-weight:900;font-size:clamp(38px,8vw,72px);letter-spacing:.08em;text-shadow:0 5px #17365c,0 0 18px #73eaff}.sub{text-align:center;color:#9fefff;margin:4px 0 22px;font-weight:800}.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#102e55;border:2px solid #5c88ad;border-radius:16px;padding:17px}.card h2{margin:0 0 10px;color:#baf5ff;font-size:21px}.card p{margin:7px 0;line-height:1.55}.keys{font-weight:900;color:#fff6a7}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}button{font:900 21px inherit;color:#09203a;background:#dffaff;border:0;border-radius:13px;padding:13px 24px;box-shadow:0 5px 0 #6da4c1;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 1px 0 #6da4c1}button.secondary{background:#ffeaa0}button.loop{background:#b9d7ff}button[hidden]{display:none}.note{text-align:center;color:#b9cee2;font-size:13px;margin-top:17px}@media(max-width:650px){.cols{grid-template-columns:1fr}.wrap{padding:18px}.card{padding:13px}}</style></head><body><main class="wrap"><div class="title">カブトビト大冒険</div><div class="sub">KABUTOBITO ADVENTURE</div><section class="cols"><div class="card"><h2>あそびかた</h2><p>ゴールの木を目指して進もう。敵は踏む・角・カタツムリの殻などで倒せます。</p><p>青い葉っぱを集めると、最後の成績で<span class="keys">30枚につきミス -1</span>。</p><p>樹液で大きくなり、グローブを取ると耐久力と攻撃が強くなります。</p></div><div class="card"><h2>操作</h2><p><span class="keys">← →</span> 移動　 <span class="keys">↓</span> しゃがむ　 <span class="keys">↑</span> 上を見る</p><p><span class="keys">A / Z / Space</span> ジャンプ。空中で長押しすると羽でゆっくり降下。</p><p><span class="keys">B</span> 角攻撃／グローブ時はパンチ。<span class="keys">↑＋B</span> で真上を攻撃。</p></div></section><div class="buttons"><button onclick="newGame(false)">はじめから</button><button class="secondary" onclick="continueGame()">つづきから</button><button id="loop2" class="loop" hidden onclick="newGame(true)">2周目で開始</button></div><div class="note" id="status"></div></main><script>
const STAGES=['world1-1.html','world1-2.html','world1-3.html','world1-4.html','world2-1.html','world2-2.html','world2-3.html','world2-4.html','world3-1.html','world3-2.html','world3-3.html','world3-4.html'];
const cleared=localStorage.getItem('maruchibiCleared')==='1'; if(cleared){document.getElementById('loop2').hidden=false;document.getElementById('status').dataset.cleared='1'}
const cur=localStorage.getItem('maruchibiCurrentStage');document.getElementById('status').textContent=cur?'つづき： '+cur.replace('world','WORLD ').replace('.html',''):'まだ冒険の記録はありません';
function clearRun(){['maruchibiScore','maruchibiStars','maruchibiBig','maruchibiGlove','maruchibiMisses','maruchibiCurrentStage'].forEach(k=>localStorage.removeItem(k))}
function newGame(loop2){clearRun();localStorage.setItem('maruchibiLoop2',loop2?'1':'0');if(loop2){localStorage.setItem('maruchibiBlueHorn','1');localStorage.setItem('maruchibiBig','1');localStorage.setItem('maruchibiGlove','0')}location.href='world1-1.html'}
function continueGame(){let s=localStorage.getItem('maruchibiCurrentStage');location.href=STAGES.includes(s)?s:'world1-1.html'}
</script></body></html>
